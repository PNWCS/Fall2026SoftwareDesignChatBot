[alembic]
# Directory containing env.py and the versions/ migration scripts. `%(here)s`
# is the directory containing this file, so this works from any shell directory.
script_location = %(here)s/alembic

# Add the application source directory to Python's import path. This lets
# env.py import backend metadata once the SQLAlchemy models are implemented.
prepend_sys_path = %(here)s/src

# Fallback database URL used when DATABASE_URL is not set in the environment.
# env.py overrides this value when DATABASE_URL is present. The URL format is:
# dialect+driver://username:password@host:port/database
sqlalchemy.url = postgresql+psycopg://pnw:pnw_dev_password@localhost:5432/pnw_chatbot

# These sections configure Python's standard logging system, which Alembic uses
# to report migration progress and database activity.
[loggers]
keys = root,sqlalchemy,alembic

# A handler sends log records to a destination. This project uses the console,
# so migration output appears in the terminal or container logs.
[handlers]
keys = console

# Formatters control the shape of each log message.
[formatters]
keys = generic

# The root logger is the fallback for loggers without a more specific setting.
# WARN keeps normal output quiet while still showing warnings and errors.
[logger_root]
level = WARN
handlers = console
qualname =

# SQLAlchemy emits database-engine messages through this logger. Keeping it at
# WARN avoids printing every SQL statement during normal migrations.
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# Alembic's INFO level shows useful revision and upgrade progress.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# The console handler writes to stderr, which is visible in local terminals and
# is collected correctly by Docker and CI log systems.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# `%(levelname)-5.5s` pads/truncates the level name to five characters. The
# timestamp format below is used only when a formatter includes `asctime`.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
